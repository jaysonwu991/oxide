[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
]
# The desktop app owns its Cargo package: it hosts the Tauri window and the
# shared desktop engine, and it is compiled with `cargo build --release` from
# its own directory. Keeping it out of this workspace leaves its GUI dependency
# graph out of every core workspace command.
exclude = [
    "crates/desktop",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.28", features = ["event-stream"] }
dirs = "5"
futures = "0.3"
getrandom = "0.2"
ratatui = "0.29"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-util", "io-std", "sync", "net"] }
unicode-width = "0.2"
oxide-core = { path = "crates/core" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
