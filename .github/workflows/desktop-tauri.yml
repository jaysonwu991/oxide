name: Desktop (Tauri)

# Builds Oxide for Desktop, the primary Tauri front-end in
# `crates/desktop-tauri`, for macOS x64 and arm64, Linux x64 and arm64, and
# Windows, and hands the installers it produced to the release job. The
# `desktop-tauri-v*` train names the release; its stable-name
# artifacts feed the public `desktop-latest` alias. Electron remains available
# from versioned `desktop-v*` releases.
#
# Apple Silicon runners build both Mac architectures. The Intel artifact is a
# native x86_64 Rust target rather than an Intel executable built on slower
# Intel hosted hardware.

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-tauri-v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macOS arm64
            artifact: macos-arm64
            arch: arm64

          - platform: macos-latest
            name: macOS x64
            artifact: macos-x64
            arch: x64

          - platform: ubuntu-24.04
            name: Linux x64
            artifact: linux-x64
            arch: x64

          # The arm64 Linux artifact is built on an arm64 runner rather than
          # cross-compiled, so the binary in it is native.
          - platform: ubuntu-24.04-arm
            name: Linux arm64
            artifact: linux-arm64
            arch: arm64

          - platform: windows-latest
            name: Windows x64
            artifact: windows-x64
            arch: x64
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    env:
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ startsWith(matrix.platform, 'macos') && matrix.arch == 'x64' && '16' || '1' }}
      CARGO_PROFILE_RELEASE_LTO: ${{ startsWith(matrix.platform, 'macos') && matrix.arch == 'x64' && 'false' || 'thin' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && matrix.arch == 'x64' && 'x86_64-apple-darwin' || '' }}

      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/desktop/pnpm-lock.yaml

      # Tauri renders through WebKitGTK on Linux. The page and diagram assets
      # are the same files Electron packages.
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libssl-dev \
            patchelf

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install the page's diagram packages
        working-directory: crates/desktop
        run: pnpm install --frozen-lockfile

      # The front-end's package is its own workspace, so its build lands in its
      # own `target/`, which is what this caches.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/desktop-tauri
          shared-key: desktop-tauri-release-${{ matrix.arch }}
          add-job-id-key: false
          cache-workspace-crates: true
          cache-on-failure: true

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/desktop-tauri-v')
        shell: bash
        run: bash ./scripts/set-version.sh "${GITHUB_REF_NAME}"

      # The same Developer ID import as `desktop.yml`: the certificate is a
      # base64 `.p12`, imported into a keychain of this run's own and put first
      # in the search list. `package.sh` finds the identity there and signs the
      # bundle with it; a build with no certificate produces an unsigned bundle
      # rather than a half-signed one.
      - name: Import the Developer ID certificate
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "no Developer ID certificate is configured; building unsigned"
            exit 0
          fi
          keychain="${RUNNER_TEMP}/oxide-signing.keychain-db"
          password="$(openssl rand -hex 16)"
          printf '%s' "${APPLE_CERTIFICATE}" | openssl base64 -d -A > "${RUNNER_TEMP}/certificate.p12"
          security create-keychain -p "${password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${password}" "${keychain}"
          security import "${RUNNER_TEMP}/certificate.p12" \
            -k "${keychain}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${password}" \
            "${keychain}"
          security list-keychains -d user -s "${keychain}" "$(security default-keychain | tr -d ' "')"

      # An App Store Connect key is a downloaded file, so it travels as a base64
      # secret and is materialized where `xcrun notarytool` reads it.
      - name: Write App Store Connect API key
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_API_KEY_P8:-}" ] || [ -z "${APPLE_API_KEY:-}" ] || [ -z "${APPLE_API_ISSUER:-}" ]; then
            echo "no App Store Connect key is configured; this build is left unnotarized"
            exit 0
          fi
          printf '%s' "${APPLE_API_KEY_P8}" | openssl base64 -d -A > "${RUNNER_TEMP}/AuthKey.p8"
          {
            printf 'APPLE_API_KEY=%s\n' "${RUNNER_TEMP}/AuthKey.p8"
            printf 'APPLE_API_KEY_ID=%s\n' "${APPLE_API_KEY}"
            printf 'APPLE_API_ISSUER=%s\n' "${APPLE_API_ISSUER}"
          } >> "${GITHUB_ENV}"

      # One command produces this platform's artifact: it compiles the binary
      # and lays the bundle out — the app, its icon and its plugins on macOS; a
      # directory with the binary, icon and desktop entry elsewhere.
      - name: Build
        working-directory: crates/desktop-tauri
        shell: bash
        run: bash ./package.sh ${{ matrix.arch }}

      - name: Prepare the Intel smoke test
        if: startsWith(matrix.platform, 'macos') && matrix.arch == 'x64'
        shell: bash
        run: |
          if ! arch -x86_64 /usr/bin/true >/dev/null 2>&1; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi

      # The binary answers the engine's own commands before it is shipped, so a
      # build that could not reach the configuration, the session store or the
      # approval store fails here rather than on a reader's machine.
      - name: Check the engine contract
        working-directory: crates/desktop-tauri
        shell: bash
        run: |
          binary=./target/release/oxide-desktop-tauri
          if [ "${{ runner.os }}" = "macOS" ]; then
            binary=./artifacts/Oxide.app/Contents/MacOS/oxide-desktop-tauri
          elif [ ! -f "$binary" ]; then
            binary="$binary.exe"
          fi
          if [ "${{ matrix.arch }}" = "x64" ] && [ "${{ runner.os }}" = "macOS" ]; then
            arch -x86_64 "$binary" --check
          else
            "$binary" --check
          fi

      # The installers `docs/desktop-tauri.md` lists under **Release assets**,
      # named the same way from release to release so the permanent link works.
      - uses: actions/upload-artifact@v4
        with:
          name: oxide-desktop-tauri-${{ matrix.artifact }}
          path: |
            crates/desktop-tauri/artifacts/*.dmg
            crates/desktop-tauri/artifacts/*-Setup.tar.gz
            crates/desktop-tauri/artifacts/*.AppImage
            crates/desktop-tauri/artifacts/*-Setup.exe
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-tauri-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: oxide-desktop-tauri-*
          merge-multiple: true
      # Keep the notes release-drafter already drafted for this tag; only create
      # a release when none exists yet. Upload everything before publishing,
      # including when reusing a draft.
      - name: Upload installers and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft \
              --title "Oxide Desktop Tauri ${GITHUB_REF_NAME#desktop-tauri-}" --generate-notes
          fi
          find release-assets -type f -print0 \
            | xargs -0 gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false

      # The public installer address now points at Tauri. Keep the legacy alias
      # during the transition so links already handed out continue to resolve.
      - name: Refresh the desktop aliases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for alias_tag in desktop-latest desktop-tauri-latest desktop-gpui-latest; do
            if ! gh release view "$alias_tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              gh release create "$alias_tag" --repo "${GITHUB_REPOSITORY}" --prerelease \
                --title "Oxide Desktop Tauri installers" \
                --notes "The newest desktop installers, at an address that does not change. Every publish replaces these files; the versioned \`desktop-tauri-v*\` release is the one that names a version."
            else
              gh release edit "$alias_tag" --repo "${GITHUB_REPOSITORY}" --prerelease \
                --title "Oxide Desktop Tauri installers"
            fi
            gh release view "$alias_tag" --repo "${GITHUB_REPOSITORY}" \
              --json assets --jq '.assets[].name' \
              | while IFS= read -r asset; do
                  gh release delete-asset "$alias_tag" "$asset" \
                    --repo "${GITHUB_REPOSITORY}" --yes
                done
            find release-assets -type f -print0 \
              | xargs -0 gh release upload "$alias_tag" --repo "${GITHUB_REPOSITORY}" --clobber
          done
