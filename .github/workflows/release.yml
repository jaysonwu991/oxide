name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  build:
    name: build ${{ matrix.platform }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            platform: darwin-arm64
            archive_ext: tar.gz

          - target: x86_64-apple-darwin
            os: macos-latest
            platform: darwin-x64
            archive_ext: tar.gz

          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-x64
            archive_ext: tar.gz

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-arm64
            archive_ext: tar.gz
            use_cross: true

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: win32-x64
            archive_ext: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross (Linux ARM)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --locked --target ${{ matrix.target }}
      - name: Build (native)
        if: "!matrix.use_cross"
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package release archive
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME}"
          asset="oxide-${ver}-${{ matrix.platform }}"
          binary="oxide"
          [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ] && binary="oxide.exe"
          staged="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/${binary}" "${staged}/${binary}"
          cd "${staged}"
          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            python -m zipfile -c "${asset}.zip" "${binary}"
            mv "${asset}.zip" "${GITHUB_WORKSPACE}/${asset}.zip"
            archive="${asset}.zip"
          else
            tar -czf "${asset}.tar.gz" "${binary}"
            mv "${asset}.tar.gz" "${GITHUB_WORKSPACE}/${asset}.tar.gz"
            archive="${asset}.tar.gz"
          fi
          cd "${GITHUB_WORKSPACE}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${archive}" > "${archive}.sha256"
          else
            shasum -a 256 "${archive}" > "${archive}.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.platform }}
          path: |
            oxide-${{ github.ref_name }}-${{ matrix.platform }}.${{ matrix.archive_ext }}
            oxide-${{ github.ref_name }}-${{ matrix.platform }}.${{ matrix.archive_ext }}.sha256
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: asset-*
          path: assets
          merge-multiple: true
      - name: Build oxide-manifest
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME}"
          {
            printf 'version: %s\n' "${ver}"
            for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
              ext="tar.gz"
              [ "${platform}" = "win32-x64" ] && ext="zip"
              printf '%s: oxide-%s-%s.%s\n' "${platform}" "${ver}" "${platform}" "${ext}"
            done
          } > assets/oxide-manifest
          cat assets/oxide-manifest
      - name: Create release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" \
                 --title "${GITHUB_REF_NAME}" --generate-notes
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find assets -type f -exec gh release upload "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" --clobber {} \;
          gh release upload "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" --clobber install.sh install.ps1
