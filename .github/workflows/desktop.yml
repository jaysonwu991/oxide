name: desktop

# Builds the desktop app for macOS (Apple Silicon), Linux x64 and arm64, and
# Windows, and hands the installers it produced to the release job. It releases
# independently of the CLI: only a `desktop-v*` tag drafts a desktop release, so
# a CLI `v*` tag
# never forces a desktop rebuild. Only the release job — the one that writes a
# release — is granted `contents: write`; a build, including a
# `workflow_dispatch` run that publishes nothing, holds a read-only token, as
# the CLI and extension workflows do. Signing and notarization happen when the
# corresponding secrets are configured: Hutch signs a release build from the
# `ELECTROBUN_DEVELOPER_ID` identity and notarizes it from the App Store Connect
# credentials, and a build with no secrets configured still produces an
# installable bundle.
#
# Every platform builds on its own host: the Electrobun devkit is published per
# platform, and there is no macOS x64 core, so the app ships for Apple Silicon
# alone and Intel Macs are not a target.

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macOS arm64
            artifact: macos-arm64

          - platform: ubuntu-24.04
            name: Linux x64
            artifact: linux-x64

          # Electrobun publishes an arm64 Linux core and Hutch a build for it, so
          # the arm64 artifact is built on an arm64 runner rather than
          # cross-compiled.
          - platform: ubuntu-24.04-arm
            name: Linux arm64
            artifact: linux-arm64

          - platform: windows-latest
            name: Windows x64
            artifact: windows-x64
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libpipewire-0.3-dev \
            librsvg2-dev

      # The app's package is its own workspace, so its bundles land in its own
      # `target/`, which is what this caches.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: desktop-app
          workspaces: crates/desktop

      - name: Install Hutch
        if: matrix.platform != 'windows-latest'
        shell: bash
        run: curl -fsSL https://hutch.blackboard.sh/hutch/install.sh | sh

      - name: Install Hutch
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: '& ([scriptblock]::Create((irm https://hutch.blackboard.sh/hutch/install.ps1)))'

      # The launcher Hutch's installer writes, which is a `.exe` on Windows and
      # sits at the same place on every platform. It is resolved rather than
      # relied on being on `PATH`: the installer only adds its directory to a
      # *new* shell's environment, which this run is not.
      - name: Find Hutch
        shell: bash
        run: |
          launcher="$HOME/.hutch/bin/hutch"
          if [ -x "${launcher}.exe" ]; then launcher="${launcher}.exe"; fi
          echo "HUTCH=${launcher}" >> "${GITHUB_ENV}"

      # The Rust SDK this package links is not a published crate: Hutch projects
      # the release named in `hutch.config.ts` into `crates/desktop/.hutch/devkit`
      # before the build, which is where the path dependency points.
      - name: Project the Electrobun devkit
        working-directory: crates/desktop
        shell: bash
        run: '"${HUTCH}" electrobun prepare'

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: ./scripts/set-version.sh "${GITHUB_REF_NAME}"

      # Only export the signing variables that actually have a value: an unset
      # GitHub secret is an empty string, and Hutch treats an empty identity as
      # one to sign with. Only the macOS job — the only one that signs or
      # notarizes — is given the secrets at all. The names are Electrobun's; the
      # repository's secrets keep the names the Tauri pipeline used.
      - name: Export code signing secrets
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          export ELECTROBUN_DEVELOPER_ID="${APPLE_SIGNING_IDENTITY:-}"
          export ELECTROBUN_APPLEID="${APPLE_ID:-}"
          export ELECTROBUN_APPLEIDPASS="${APPLE_PASSWORD:-}"
          export ELECTROBUN_TEAMID="${APPLE_TEAM_ID:-}"
          export ELECTROBUN_APPLEAPIKEY="${APPLE_API_KEY:-}"
          export ELECTROBUN_APPLEAPIISSUER="${APPLE_API_ISSUER:-}"
          for name in \
            ELECTROBUN_DEVELOPER_ID \
            ELECTROBUN_APPLEID \
            ELECTROBUN_APPLEIDPASS \
            ELECTROBUN_TEAMID \
            ELECTROBUN_APPLEAPIKEY \
            ELECTROBUN_APPLEAPIISSUER; do
            value="${!name:-}"
            if [ -n "${value}" ]; then
              delimiter="OXIDE_ENV_${RANDOM}${RANDOM}${RANDOM}"
              {
                printf '%s<<%s\n' "${name}" "${delimiter}"
                printf '%s\n' "${value}"
                printf '%s\n' "${delimiter}"
              } >> "${GITHUB_ENV}"
            fi
          done

      # An App Store Connect key is a downloaded file, so it travels as a base64
      # secret and is materialized where Hutch reads it.
      - name: Write App Store Connect API key
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_API_KEY_P8:-}" ]; then
            printf '%s' "${APPLE_API_KEY_P8}" | openssl base64 -d -A > "${RUNNER_TEMP}/AuthKey.p8"
            echo "ELECTROBUN_APPLEAPIKEYPATH=${RUNNER_TEMP}/AuthKey.p8" >> "${GITHUB_ENV}"
          fi

      # The Developer ID identity has to be in a keychain for `codesign` to use
      # it: the certificate arrives as a base64 `.p12` and is imported into a
      # temporary keychain of this run's own, which is then put first in the
      # search list. A build with no certificate is left to produce an unsigned
      # bundle rather than a half-signed one.
      - name: Import the Developer ID certificate
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "no Developer ID certificate is configured; building unsigned"
            exit 0
          fi
          keychain="${RUNNER_TEMP}/oxide-signing.keychain-db"
          password="$(openssl rand -hex 16)"
          printf '%s' "${APPLE_CERTIFICATE}" | openssl base64 -d -A > "${RUNNER_TEMP}/certificate.p12"
          security create-keychain -p "${password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${password}" "${keychain}"
          security import "${RUNNER_TEMP}/certificate.p12" \
            -k "${keychain}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${password}" \
            "${keychain}"
          security list-keychains -d user -s "${keychain}" "$(security default-keychain | tr -d ' "')"
          rm -f "${RUNNER_TEMP}/certificate.p12"

      # One command produces the installer, the update archive and the update
      # metadata for this platform; a build that produces no installer fails the
      # upload step below rather than shipping a release missing its assets.
      - name: Build
        working-directory: crates/desktop
        shell: bash
        run: '"${HUTCH}" electrobun build --env=stable'

      # The installers `docs/desktop.md` lists under **Release assets**. The
      # `.tar.zst` archive, the delta patches and the update metadata that names
      # them are Electrobun's own updater payload and are left out: this app's
      # updater installs the installer, and metadata pointing at an archive the
      # release does not carry is worse than none.
      - uses: actions/upload-artifact@v4
        with:
          name: oxide-desktop-${{ matrix.artifact }}
          path: |
            crates/desktop/artifacts/*.dmg
            crates/desktop/artifacts/*-Setup.zip
            crates/desktop/artifacts/*-Setup.tar.gz
          if-no-files-found: error

  release:
    name: draft the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      # Keep the notes release-drafter already drafted for this tag; only create
      # a release when none exists yet (for example a tag pushed by hand).
      - name: Create draft release and upload installers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft \
              --title "Oxide Desktop ${GITHUB_REF_NAME#desktop-}" --generate-notes
          fi
          find release-assets -type f -print0 \
            | xargs -0 gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber
