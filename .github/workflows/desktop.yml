name: desktop

# Electron packages the same Chromium runtime on macOS, Linux and Windows. The
# Rust host is compiled for the matching target and copied beside the packaged
# app by Electron Forge.

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            os: macos-latest
            platform: darwin
            arch: arm64
            rust_target: aarch64-apple-darwin
            host: oxide-desktop-host
          - label: macOS x64
            os: macos-latest
            platform: darwin
            arch: x64
            rust_target: x86_64-apple-darwin
            host: oxide-desktop-host
          - label: Linux x64
            os: ubuntu-22.04
            platform: linux
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
            host: oxide-desktop-host
          - label: Windows x64
            os: windows-latest
            platform: win32
            arch: x64
            rust_target: x86_64-pc-windows-msvc
            host: oxide-desktop-host.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.rust_target }}

      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/desktop/pnpm-lock.yaml

      - name: Install Linux package tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm

      - name: Install Electron dependencies
        working-directory: crates/desktop
        run: pnpm install --frozen-lockfile

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/set-version.sh "${GITHUB_REF_NAME}"
          cargo update --workspace

      - name: Export Apple signing and notarization settings
        if: matrix.platform == 'darwin'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          for name in APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_ISSUER APPLE_API_KEY; do
            value="${!name:-}"
            if [ -n "${value}" ]; then
              delimiter="OXIDE_ENV_${RANDOM}${RANDOM}${RANDOM}"
              {
                printf '%s<<%s\n' "${name}" "${delimiter}"
                printf '%s\n' "${value}"
                printf '%s\n' "${delimiter}"
              } >> "${GITHUB_ENV}"
            fi
          done
          if [ -n "${APPLE_CERTIFICATE:-}" ]; then
            certificate="${RUNNER_TEMP}/oxide-signing.p12"
            keychain="${RUNNER_TEMP}/oxide-signing.keychain-db"
            password="oxide-${RANDOM}-${RANDOM}"
            printf '%s' "${APPLE_CERTIFICATE}" | openssl base64 -d -A > "${certificate}"
            security create-keychain -p "${password}" "${keychain}"
            security set-keychain-settings -lut 21600 "${keychain}"
            security unlock-keychain -p "${password}" "${keychain}"
            security import "${certificate}" -P "${APPLE_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${keychain}"
            security set-key-partition-list -S apple-tool:,apple: -s -k "${password}" "${keychain}"
            security list-keychain -d user -s "${keychain}" login.keychain-db
          elif [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "APPLE_SIGNING_IDENTITY=-" >> "${GITHUB_ENV}"
          fi

      - name: Write App Store Connect API key
        if: matrix.platform == 'darwin'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_API_KEY_P8:-}" ]; then
            printf '%s' "${APPLE_API_KEY_P8}" | openssl base64 -d -A > "${RUNNER_TEMP}/AuthKey.p8"
            echo "APPLE_API_KEY_PATH=${RUNNER_TEMP}/AuthKey.p8" >> "${GITHUB_ENV}"
          fi

      - name: Build the Rust host
        run: cargo build --release --locked -p oxide-desktop --bin oxide-desktop-host --target ${{ matrix.rust_target }}

      - name: Package installers
        working-directory: crates/desktop
        shell: bash
        env:
          OXIDE_DESKTOP_HOST: ${{ github.workspace }}/target/${{ matrix.rust_target }}/release/${{ matrix.host }}
        run: pnpm exec electron-forge make --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: oxide-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: crates/desktop/out/make/**/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create draft release and upload installers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft \
              --title "Oxide Desktop ${GITHUB_REF_NAME#desktop-}" --generate-notes
          fi
          find release-assets -type f -print0 \
            | xargs -0 gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber
