name: desktop

# Builds the desktop app for macOS, Linux, and Windows and hands the installers
# it produced to the release job. It releases independently of the CLI: only a
# `desktop-v*` tag drafts a desktop release, so a CLI `v*` tag never forces a
# desktop rebuild. Only the release job — the one that writes a release — is
# granted `contents: write`; a build, including a `workflow_dispatch` run that
# publishes nothing, holds a read-only token, as the CLI and extension
# workflows do. Signing and notarization happen automatically when the
# corresponding secrets are configured; without them the macOS bundle is ad-hoc
# signed (so it still launches after Gatekeeper approval) and the other
# platforms are produced unsigned.

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macOS arm64
            artifact: macos-arm64
            args: "--features gui --target aarch64-apple-darwin"

          - platform: macos-latest
            name: macOS x64
            artifact: macos-x64
            args: "--features gui --target x86_64-apple-darwin"

          - platform: ubuntu-22.04
            name: Linux x64
            artifact: linux-x64
            args: "--features gui"

          - platform: windows-latest
            name: Windows x64
            artifact: windows-x64
            args: "--features gui"
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # The crate is a workspace member, so its bundles land in the workspace's
      # own `target/`, which is what this caches.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: desktop

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/set-version.sh "${GITHUB_REF_NAME}"
          cargo update --workspace

      # Only export signing variables that actually have a value: an unset
      # GitHub secret becomes an empty string, which Tauri treats as "set" and
      # then fails to import an empty certificate/key. Only the macOS jobs — the
      # only ones that sign or notarize — are given the secrets at all.
      - name: Export code signing secrets
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID \
            APPLE_API_ISSUER \
            APPLE_API_KEY; do
            value="${!name:-}"
            if [ -n "${value}" ]; then
              delimiter="OXIDE_ENV_${RANDOM}${RANDOM}${RANDOM}"
              {
                printf '%s<<%s\n' "${name}" "${delimiter}"
                printf '%s\n' "${value}"
                printf '%s\n' "${delimiter}"
              } >> "${GITHUB_ENV}"
            fi
          done

      # The App Store Connect key is a downloaded file, so it travels as a
      # base64 secret and is materialized where Tauri expects it.
      - name: Write App Store Connect API key
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_API_KEY_P8:-}" ]; then
            printf '%s' "${APPLE_API_KEY_P8}" | openssl base64 -d -A > "${RUNNER_TEMP}/AuthKey.p8"
            echo "APPLE_API_KEY_PATH=${RUNNER_TEMP}/AuthKey.p8" >> "${GITHUB_ENV}"
          fi

      # A macOS bundle with no signature at all is rejected by Gatekeeper as
      # "damaged" on Apple Silicon. When no Developer ID is configured, sign
      # ad-hoc so the app has a valid signature over its resources; the real
      # identity, when present, takes precedence over this default.
      - name: Ad-hoc sign macOS without a Developer ID
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${APPLE_SIGNING_IDENTITY:-}" ] && [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "APPLE_SIGNING_IDENTITY=-" >> "${GITHUB_ENV}"
          fi

      # A build only: no `tagName`, so the action drafts no release and uploads
      # nothing, which is why this job needs no token beyond the read-only one
      # its permissions grant. Nothing here is an updater artifact, so no
      # `latest.json` is written either.
      - name: Build
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: crates/desktop
          args: ${{ matrix.args }}
          uploadUpdaterJson: false

      # The installers this platform produced — the same ones `docs/desktop.md`
      # lists under **Release assets** — for the release job to upload. A
      # platform that silently bundles nothing fails here rather than shipping a
      # release missing its assets.
      - uses: actions/upload-artifact@v4
        with:
          name: oxide-desktop-${{ matrix.artifact }}
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/rpm/*.rpm
            target/**/release/bundle/appimage/*.AppImage
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: draft the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      # Keep the notes release-drafter already drafted for this tag; only create
      # a release when none exists yet (for example a tag pushed by hand).
      - name: Create draft release and upload installers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft \
              --title "Oxide Desktop ${GITHUB_REF_NAME#desktop-}" --generate-notes
          fi
          find release-assets -type f -print0 \
            | xargs -0 gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber
