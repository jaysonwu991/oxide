name: VS Code

# Builds and publishes the VS Code extension. It releases independently of the
# CLI and the desktop app: only an `extension-v*` tag builds the VSIX and
# attaches it to the matching release, so neither a `v*` nor a `desktop-v*` tag
# rebuilds it. The extension is a standalone pnpm/TypeScript package, so the job
# mirrors the `vscode` job in `ci.yml` (type check, unit tests, `vsce package`)
# and then uploads the artifact the release-drafter notes advertise.

on:
  push:
    tags: ["extension-v*"]

permissions:
  contents: read

jobs:
  build:
    name: build vsix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: editors/vscode/pnpm-lock.yaml
      - name: Set version from tag
        shell: bash
        run: ./scripts/set-version.sh "${GITHUB_REF_NAME}"
      - name: Install dependencies
        working-directory: editors/vscode
        run: pnpm install --frozen-lockfile
      - name: Type check
        working-directory: editors/vscode
        run: pnpm run check
      - name: Test
        working-directory: editors/vscode
        run: pnpm test
      - name: Package
        working-directory: editors/vscode
        run: pnpm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: editors/vscode/*.vsix
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: vsix
      # Keep the notes release-drafter already drafted for this tag; only create
      # a release when none exists yet (for example a tag pushed by hand).
      - name: Create release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" \
                 --title "Oxide for VS Code ${GITHUB_REF_NAME#extension-}" --generate-notes
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find vsix -type f -name '*.vsix' -exec gh release upload "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" --clobber {} \;
      # `/releases/latest` is the newest release of the repository, and three
      # components publish into it, so a permanent download link cannot be built
      # on `latest`. This alias release holds the VSIX under a tag that never
      # moves and is replaced on every publish — `README.md` links to
      # `releases/download/extension-latest/oxide-vscode.vsix` for that reason.
      # It is marked a pre-release so `/releases/latest` keeps pointing at a
      # versioned release, which is what the CLI's manifest is resolved from.
      - name: Refresh the extension-latest alias
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          alias_tag=extension-latest
          gh release view "$alias_tag" --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "$alias_tag" --repo "${{ github.repository }}" --prerelease \
                 --title "Oxide for VS Code installer" \
                 --notes "The newest VSIX, at an address that does not change. Every publish replaces this file; the versioned \`extension-v*\` release is the one that names a version."
          find vsix -type f -name '*.vsix' -exec gh release upload "$alias_tag" --repo "${{ github.repository }}" --clobber {} \;
