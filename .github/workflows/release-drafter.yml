name: release-drafter

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: write
  pull-requests: write

jobs:
  update_release_draft:
    # Fork PRs only get a read-only token, so skip the job entirely rather than
    # let the drafter or autolabeler fail on a fork event.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # The drafts themselves only change when a pull request merges into main.
      # Each component has its own config, pinned to its own tag prefix, so the
      # two runs keep to their own draft.
      - name: Draft the next CLI release
        if: github.event_name == 'push'
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.cli.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Draft the next desktop release
        if: github.event_name == 'push'
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.desktop.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # v7 moved the autolabeler into its own action; it reads the
      # `autolabeler` section of `release-drafter.cli.yml` (the desktop config
      # carries no autolabeler of its own) and applies the type labels that
      # both changelogs also match on.
      - name: Apply type labels
        if: github.event_name == 'pull_request'
        uses: release-drafter/release-drafter/autolabeler@v7
        with:
          config-name: release-drafter.cli.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # release-drafter's autolabeler matches one file at a time, so it cannot
      # express "only this crate". Label the component only when every changed
      # file lives under it; a shared (`crates/core`) or mixed change keeps no
      # component label. A rename counts its old path too, so moving a file
      # between crates is not mistaken for a single-crate change.
      - name: Label the changed component
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          files="$(gh api "repos/${REPO}/pulls/${PR}/files" --paginate \
            --jq '.[] | (.filename, .previous_filename) | select(. != null)')"
          only_cli=1
          only_desktop=1
          counted=0
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            counted=1
            case "$file" in crates/cli/*) ;; *) only_cli=0 ;; esac
            case "$file" in crates/desktop/*) ;; *) only_desktop=0 ;; esac
          done <<< "$files"

          label=""
          if [ "$counted" = 1 ]; then
            if [ "$only_cli" = 1 ]; then label="cli"; fi
            if [ "$only_desktop" = 1 ]; then label="desktop"; fi
          fi

          current="$(gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name')"
          has() { printf '%s\n' "$current" | grep -qx "$1"; }
          add() { if ! has "$1"; then gh pr edit "$PR" --repo "$REPO" --add-label "$1"; fi; }
          remove() { if has "$1"; then gh pr edit "$PR" --repo "$REPO" --remove-label "$1"; fi; }

          case "$label" in
            cli) remove desktop; add cli ;;
            desktop) remove cli; add desktop ;;
            *) remove cli; remove desktop ;;
          esac
