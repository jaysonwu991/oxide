name: CI

# Pull-request and `main` checks for the whole repository: the Rust workspace
# (formatting, clippy, tests), the desktop app with its
# front-end checks, and the VS Code extension. This
# workflow only verifies; the tag-triggered release workflows (`cli.yml`,
# `desktop.yml`, and `vscode.yml`) build the shippable artifacts.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked

  # Formatting and linting are platform-independent, so run them once instead
  # of paying for Clippy's separate check graph on all three hosted runners.
  desktop-lint:
    name: desktop lint
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-lint
          workspaces: crates/desktop
          cache-on-failure: true
      - uses: pnpm/action-setup@v4
        with:
          version: 12.23.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/desktop/pnpm-lock.yaml
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libssl-dev \
            patchelf
      - name: Install the page's diagram and editor packages
        working-directory: crates/desktop
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        working-directory: crates/desktop
        run: cargo fmt -- --check
      - name: Lint Oxide Desktop
        working-directory: crates/desktop
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build the CLI the front-end checks read
        run: cargo build -p oxide --locked
      - name: Check the front-end
        run: node crates/desktop/check-app.mjs
      - name: Check shared diagram rendering
        run: node --test shared/diagrams.test.mjs

  # Build and test the debug profile on each platform Oxide Desktop ships to.
  # The optimized LTO build and platform packages stay tag-time work in `desktop.yml`.
  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop
          workspaces: crates/desktop
          cache-on-failure: true
      - uses: pnpm/action-setup@v4
        with:
          version: 12.23.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/desktop/pnpm-lock.yaml
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libssl-dev \
            patchelf
      - name: Install the page's diagram and editor packages
        working-directory: crates/desktop
        run: pnpm install --frozen-lockfile
      - name: Test Oxide Desktop
        working-directory: crates/desktop
        run: cargo test --locked
      - name: Build the debug app
        working-directory: crates/desktop
        run: cargo build --locked
      - name: Check the engine contract
        working-directory: crates/desktop
        shell: bash
        run: |
          binary=./target/debug/oxide-desktop
          if [ ! -f "$binary" ]; then
            binary="$binary.exe"
          fi
          "$binary" --check
      - name: Check the host contract
        run: node crates/desktop/check-shell.mjs

  # The extension is a standalone pnpm/TypeScript package, so it is not covered
  # by the Cargo jobs. Run its type check and unit tests on each platform the
  # extension is installed on — the resume path, the CLI's path lookup, the
  # listing readers and the wrapping of a Windows batch shim all have a
  # per-platform branch, and a suite that only runs on Linux cannot see one —
  # and a real `vsce package` so a broken manifest or bundling change fails
  # here.
  vscode:
    name: vscode (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.23.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: editors/vscode/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: editors/vscode
        run: pnpm install --frozen-lockfile
      - name: Type check
        working-directory: editors/vscode
        run: pnpm run check
      - name: Test
        working-directory: editors/vscode
        run: pnpm test
      - name: Package
        if: matrix.os == 'ubuntu-latest'
        working-directory: editors/vscode
        run: pnpm run package
