name: ci

# Pull-request and `main` checks for the whole repository: the Rust workspace
# (formatting, clippy, tests), the Electron desktop shell and Rust host, and the
# VS Code extension. This
# workflow only verifies; the tag-triggered release workflows (`cli.yml`,
# `desktop.yml`, and `vscode.yml`) build the shippable artifacts.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked

  # Exercise the preload/IPC boundary, the real Rust host protocol, renderer
  # behavior and an Electron package on every supported operating system.
  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/desktop/pnpm-lock.yaml
      - name: Install desktop dependencies
        working-directory: crates/desktop
        run: pnpm install --frozen-lockfile
      - name: Lint the desktop app
        run: cargo clippy -p oxide-desktop --all-targets --locked -- -D warnings
      - name: Check the renderer and host bridge
        working-directory: crates/desktop
        run: pnpm run check
      - name: Package the desktop app
        working-directory: crates/desktop
        run: pnpm run package

  # The extension is a standalone pnpm/TypeScript package, so it is not covered
  # by the Cargo jobs. Run its type check and unit tests on each platform the
  # extension is installed on — the resume path, the CLI's path lookup, the
  # listing readers and the wrapping of a Windows batch shim all have a
  # per-platform branch, and a suite that only runs on Linux cannot see one —
  # and a real `vsce package` so a broken manifest or bundling change fails
  # here.
  vscode:
    name: vscode (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: editors/vscode/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: editors/vscode
        run: pnpm install --frozen-lockfile
      - name: Type check
        working-directory: editors/vscode
        run: pnpm run check
      - name: Test
        working-directory: editors/vscode
        run: pnpm test
      - name: Package
        if: matrix.os == 'ubuntu-latest'
        working-directory: editors/vscode
        run: pnpm run package
