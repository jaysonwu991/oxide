name: CI

# Pull-request and `main` checks for the whole repository: the Rust workspace
# (formatting, clippy, tests), the desktop app with its
# front-end checks, and the VS Code extension. This
# workflow only verifies; the tag-triggered release workflows (`cli.yml`,
# `desktop.yml`, and `vscode.yml`) build the shippable artifacts.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked

  # The desktop app is a workspace of its own, so the `test` job above never
  # compiles it; its checks run from its own directory. Build and lint it on
  # each platform — with the system libraries Electron links, so a
  # platform-specific break is caught on the pull request instead of at tag
  # time — and run the front-end checks, since no Rust test runs the app's own
  # JavaScript. The window is TypeScript in `electron/`, so its own type check
  # runs here too, and the two halves of the shell are joined by
  # `check-shell.mjs`.
  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # The app's package is its own workspace, so it caches on its own; the
      # root workspace's cache is restored beside it for the CLI the front-end
      # checks read their catalog from.
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-app
          workspaces: crates/desktop
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/desktop/pnpm-lock.yaml
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 \
            libnss3 \
            libasound2t64 \
            libgbm1 \
            libxss1 \
            libxtst6
      - name: Install the app's packages
        working-directory: crates/desktop
        run: pnpm install --frozen-lockfile
      - name: Type check the window
        working-directory: crates/desktop
        run: pnpm run check
      - name: Check formatting
        working-directory: crates/desktop
        run: cargo fmt -- --check
      - name: Lint the desktop app
        working-directory: crates/desktop
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test the desktop app
        working-directory: crates/desktop
        run: cargo test --locked
      - name: Build the CLI the front-end checks read
        run: cargo build -p oxide --locked
      - name: Check the shell the window is opened by
        run: node crates/desktop/check-shell.mjs
      - name: Check the front-end
        run: node crates/desktop/check-app.mjs
      - name: Check shared diagram rendering
        run: node --test shared/diagrams.test.mjs

  # The GPUI front-end is a workspace of its own too, so the root jobs never
  # compile it. It is checked on each platform it ships to — the window system
  # it opens and the GPU backend it draws with have a per-platform branch — with
  # formatting, clippy, its tests, a release build and the engine check the
  # release workflow runs before packaging, so a break in the beta is caught on
  # the pull request rather than at tag time.
  desktop-gpui:
    name: desktop-gpui (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-gpui
          workspaces: crates/desktop-gpui
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libvulkan1 \
            libvulkan-dev \
            libasound2t64 \
            libssl-dev \
            libgbm1
      - name: Check formatting
        working-directory: crates/desktop-gpui
        run: cargo fmt -- --check
      - name: Lint the beta front-end
        working-directory: crates/desktop-gpui
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test the beta front-end
        working-directory: crates/desktop-gpui
        run: cargo test --locked
      - name: Build the beta front-end
        working-directory: crates/desktop-gpui
        run: cargo build --release --locked
      - name: Check the engine contract
        working-directory: crates/desktop-gpui
        shell: bash
        run: |
          binary=./target/release/oxide-desktop-gpui
          if [ ! -f "$binary" ]; then
            binary="$binary.exe"
          fi
          "$binary" --check

  # The extension is a standalone pnpm/TypeScript package, so it is not covered
  # by the Cargo jobs. Run its type check and unit tests on each platform the
  # extension is installed on — the resume path, the CLI's path lookup, the
  # listing readers and the wrapping of a Windows batch shim all have a
  # per-platform branch, and a suite that only runs on Linux cannot see one —
  # and a real `vsce package` so a broken manifest or bundling change fails
  # here.
  vscode:
    name: vscode (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: editors/vscode/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: editors/vscode
        run: pnpm install --frozen-lockfile
      - name: Type check
        working-directory: editors/vscode
        run: pnpm run check
      - name: Test
        working-directory: editors/vscode
        run: pnpm test
      - name: Package
        if: matrix.os == 'ubuntu-latest'
        working-directory: editors/vscode
        run: pnpm run package
