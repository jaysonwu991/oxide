# Release Drafter configuration for the desktop app. It drafts the next desktop
# release on every push to `main`, alongside the CLI draft that
# `release-drafter.cli.yml` maintains; both are run by
# .github/workflows/release-drafter.yml.
#
# The two drafters coexist because each one is pinned to the tag prefix of its
# own component: a run only ever sees its own releases, which keeps the other
# component's draft out of the draft search and out of the previous-release
# lookup that resolves the next version. Without a prefix, both runs would
# adopt whichever draft GitHub returns first.
#
# Categories match a conventional-commit title directly, and also accept the
# type labels the autolabeler action
# (release-drafter/release-drafter/autolabeler@v7) derives from that title. That
# action runs once, from the CLI config, so the labels land on the PR either
# way. `.github/labels.yml` creates the labels it applies.
#
# The categories, replacers, and change templates are shared with the CLI
# config; keep the two files in sync.

name-template: 'Oxide Desktop v$RESOLVED_VERSION'
tag-template: 'desktop-v$RESOLVED_VERSION'
tag-prefix: 'desktop-v'
change-template: '- $TITLE (#$NUMBER) by @$AUTHOR'
change-title-escapes: '\<*_&'
category-template: '### $TITLE'
sort-by: merged_at
sort-direction: descending

# Drop a `feat(scope): ` prefix so the notes read as plain English.
replacers:
  - search: '/^(feat|fix|perf|refactor|docs|test|ci|build|chore)(\(.+?\))?!?:\s*/i'
    replace: ''

categories:
  # Administrative labels that should never reach the changelog.
  - type: 'pre-exclude'
    when:
      labels:
        - 'skip-changelog'
        - 'duplicate'
        - 'invalid'
        - 'question'
        - 'wontfix'

  - title: '⚠️ Breaking Changes'
    semver-increment: 'major'
    collapse-after: 3
    when:
      - conventional:
          breaking: true
      - label: 'breaking'

  - title: '🚀 Features'
    semver-increment: 'minor'
    when:
      - conventional:
          type: 'feat'
      - labels:
          - 'enhancement'
          - 'feat'
          - 'feature'

  - title: '🐛 Bug Fixes'
    when:
      - conventional:
          type: 'fix'
      - labels:
          - 'bug'
          - 'fix'
          - 'bugfix'

  - title: '⚡ Performance'
    when:
      - conventional:
          type: 'perf'
      - label: 'performance'

  - title: '📚 Documentation'
    when:
      - conventional:
          type: 'docs'
      - label: 'documentation'

  - title: '♻️ Refactoring'
    when:
      - conventional:
          type: 'refactor'
      - label: 'refactor'

  - title: '🧪 Tests'
    collapse-after: 5
    when:
      - conventional:
          type: 'test'
      - label: 'test'

  - title: '🏗️ Build & CI'
    collapse-after: 5
    when:
      - conventional:
          types:
            - 'ci'
            - 'build'
      - label: 'ci'

  - title: '📦 Dependencies'
    collapse-after: 5
    when:
      labels:
        - 'dependencies'
        - 'deps'

  - title: '🧰 Maintenance'
    collapse-after: 5
    when:
      - conventional:
          type: 'chore'
      - label: 'chore'

  # The one changelog category without `when` receives anything uncategorized.
  - title: '🧩 Other Changes'

no-changes-template: |
  _No user-facing changes in this release._

template: |
  ## What's Changed

  $CHANGES

  ## Install

  Download the bundle for your platform from the assets below:

  - **macOS** — `dmg` for Apple Silicon (`aarch64`) or Intel (`x64`)
  - **Windows** — `exe` installer or `msi` package
  - **Linux** — `AppImage`, `deb`, or `rpm`

  The CLI is released separately: its binaries, install scripts, and notes live
  on the [releases page](https://github.com/$OWNER/$REPOSITORY/releases).

  ## Full Changelog

  https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...desktop-v$RESOLVED_VERSION

  ## New Contributors

  $NEW_CONTRIBUTORS

  ## Contributors

  $CONTRIBUTORS
