# Release Drafter configuration for the VS Code extension. It drafts the next
# extension release on every push to `main`, alongside the CLI draft that
# `release-drafter.cli.yml` maintains and the desktop draft in
# `release-drafter.desktop.yml`; all three are run by
# .github/workflows/release-drafter.yml.
#
# Each drafter is pinned to the tag prefix of its own component, so a run only
# ever sees its own releases. That keeps the other components' drafts out of the
# draft search and out of the previous-release lookup that resolves the next
# version; without a prefix, every run would adopt whichever draft GitHub
# returns first.
#
# The extension's prefix is `extension-v`, not `vscode-v`, on purpose: a tag
# starting with `v` would match the CLI workflow's `v*` trigger and the CLI
# drafter's `v` prefix too. The desktop's `desktop-v` avoids the same collision.
#
# Categories match a conventional-commit title directly, and also accept the
# type labels the autolabeler action
# (release-drafter/release-drafter/autolabeler@v7) derives from that title. That
# action runs once, from the CLI config, so the labels land on the PR either
# way. `.github/labels.yml` creates the labels it applies.
#
# The categories, replacers, and change templates are shared with the CLI and
# desktop configs; keep the three files in sync.

name-template: 'Oxide for VS Code v$RESOLVED_VERSION'
tag-template: 'extension-v$RESOLVED_VERSION'
tag-prefix: 'extension-v'
change-template: '- $TITLE (#$NUMBER) by @$AUTHOR'
change-title-escapes: '\<*_&'
category-template: '### $TITLE'
sort-by: merged_at
sort-direction: descending

# Drop a `feat(scope): ` prefix so the notes read as plain English.
replacers:
  - search: '/^(feat|fix|perf|refactor|docs|test|ci|build|chore)(\(.+?\))?!?:\s*/i'
    replace: ''

categories:
  # Administrative labels that should never reach the changelog.
  - type: 'pre-exclude'
    when:
      labels:
        - 'skip-changelog'
        - 'duplicate'
        - 'invalid'
        - 'question'
        - 'wontfix'

  - title: '⚠️ Breaking Changes'
    semver-increment: 'major'
    collapse-after: 3
    when:
      - conventional:
          breaking: true
      - label: 'breaking'

  - title: '🚀 Features'
    semver-increment: 'minor'
    when:
      - conventional:
          type: 'feat'
      - labels:
          - 'enhancement'
          - 'feat'
          - 'feature'

  - title: '🐛 Bug Fixes'
    when:
      - conventional:
          type: 'fix'
      - labels:
          - 'bug'
          - 'fix'
          - 'bugfix'

  - title: '⚡ Performance'
    when:
      - conventional:
          type: 'perf'
      - label: 'performance'

  - title: '📚 Documentation'
    when:
      - conventional:
          type: 'docs'
      - label: 'documentation'

  - title: '♻️ Refactoring'
    when:
      - conventional:
          type: 'refactor'
      - label: 'refactor'

  - title: '🧪 Tests'
    collapse-after: 5
    when:
      - conventional:
          type: 'test'
      - label: 'test'

  - title: '🏗️ Build & CI'
    collapse-after: 5
    when:
      - conventional:
          types:
            - 'ci'
            - 'build'
      - label: 'ci'

  - title: '📦 Dependencies'
    collapse-after: 5
    when:
      labels:
        - 'dependencies'
        - 'deps'

  - title: '🧰 Maintenance'
    collapse-after: 5
    when:
      - conventional:
          type: 'chore'
      - label: 'chore'

  # The one changelog category without `when` receives anything uncategorized.
  - title: '🧩 Other Changes'

no-changes-template: |
  _No user-facing changes in this release._

template: |
  ## What's Changed

  $CHANGES

  ## Install

  Download `oxide-vscode-$RESOLVED_VERSION.vsix` from the assets below, then in
  VS Code run **Extensions: Install from VSIX…**. The extension is also on the
  [Visual Studio Marketplace](https://marketplace.visualstudio.com/items?itemName=jaysonwu991.oxide-vscode)
  as `jaysonwu991.oxide-vscode`, where it can be installed directly once the
  release is published there.

  The extension drives the `oxide` CLI, which is released separately: install it
  from the [releases page](https://github.com/$OWNER/$REPOSITORY/releases) (see
  `install.sh` / `install.ps1`).

  ## Full Changelog

  https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...extension-v$RESOLVED_VERSION

  ## New Contributors

  $NEW_CONTRIBUTORS

  ## Contributors

  $CONTRIBUTORS
