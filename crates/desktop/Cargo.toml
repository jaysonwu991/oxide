[package]
name = "oxide-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Desktop app for Oxide: manage multiple projects and sessions"

[features]
default = []
gui = [
    "dep:tauri",
    "dep:tauri-plugin-dialog",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
    "dep:block2",
]

[dependencies]
oxide-core.workspace = true
anyhow.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-dialog = { version = "2", optional = true }

# The window's first click is taken back from AppKit on macOS (see
# `src/first_click.rs`), which needs the Objective-C runtime directly. These
# crates are already built for the gui feature through tauri/wry.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true, default-features = false, features = [
    "std",
] }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "NSApplication",
    "NSResponder",
    "NSEvent",
    "NSView",
    "NSWindow",
    "block2",
] }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = [
    "std",
] }
block2 = { version = "0.6", optional = true, default-features = false, features = [
    "std",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "oxide-desktop"
path = "src/main.rs"
required-features = ["gui"]
