[package]
name = "oxide-desktop"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "Desktop app for Oxide: manage multiple projects and sessions"

# This package is excluded from the root workspace on purpose. Its main process
# is Electrobun's Rust SDK, and the crate for it is projected into
# `.hutch/devkit/rust-sdk` by `hutch electrobun sync` rather than published to
# crates.io. A workspace member naming that path would make every cargo command
# in the workspace fail until the desktop project had been synced.
#
# The projected SDK is excluded from this package's own workspace for the same
# reason it is not ours to lint: it is a path dependency inside the workspace
# directory, which Cargo would otherwise adopt as a member and build with `-D
# warnings` applied to generated code.
[workspace]
exclude = [".hutch"]

[features]
default = []
gui = ["dep:electrobun"]

[dependencies]
oxide-core = { path = "../core" }
anyhow = "1"
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-util", "io-std", "sync", "net"] }
electrobun = { path = ".hutch/devkit/rust-sdk", optional = true }

[[bin]]
name = "oxide-desktop"
path = "src/main.rs"
required-features = ["gui"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
