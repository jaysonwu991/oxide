[package]
name = "oxide-desktop"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "Desktop app for Oxide: manage multiple projects and sessions"

# This package is one half of the desktop app: the process the Electron window
# in `crates/desktop/electron` starts, which owns the projects, the sessions and
# the turns. It is excluded from the root workspace on purpose, so the app's
# dependencies and its own lock file stay out of the core workspace's build
# graph — the same shape the VS Code extension has, in the other direction.
[workspace]

[dependencies]
oxide-core = { path = "../core" }
anyhow = "1"
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-util", "io-std", "sync", "net"] }

[[bin]]
name = "oxide-desktop"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
