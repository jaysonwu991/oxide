[package]
name = "oxide-desktop-gpui"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "Oxide for Desktop: the native GPUI front-end"

# This package is the primary GPUI front-end: one native process that draws the
# whole window and shares the desktop engine (`oxide-desktop`'s library half)
# with the Electron app, so both front-ends read and write the same
# configuration, session store and approvals. Like `crates/desktop`, it owns its
# own workspace so its dependency graph and lock file stay out of the core
# workspace's build.
[workspace]

[dependencies]
oxide-core = { path = "../core" }
oxide-desktop = { path = "../desktop" }
anyhow = "1"
# `runtime_shaders` compiles GPUI's Metal shaders at launch instead of at build
# time, so a machine without Xcode's downloadable Metal toolchain can still
# build this app (see docs/desktop-gpui.md).
# Keep both GPUI packages on one Zed revision; this revision publishes AccessKit
# nodes to macOS, Windows and Linux.
gpui = { git = "https://github.com/zed-industries/zed", rev = "596dfdcf32d85d4d8d17a8887b4d0979ec7c5e14" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "596dfdcf32d85d4d8d17a8887b4d0979ec7c5e14", features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-util", "io-std", "sync", "net"] }
unicode-segmentation = "1"
vt100 = "0.18.1"
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
# Keep these on the version GPUI paints with, so the SVG stack is built once.
resvg = "0.46"
usvg = "0.46"

[dev-dependencies]

[[bin]]
name = "oxide-desktop-gpui"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
