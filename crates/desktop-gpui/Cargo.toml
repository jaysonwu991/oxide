[package]
name = "oxide-desktop-gpui"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "Oxide for Desktop (Beta): the GPUI front-end"

# This package is the GPUI front-end: one native process that draws the whole
# window and shares the desktop engine (`oxide-desktop`'s library half) with the
# Electron app, so both front-ends read and write the same configuration,
# session store and approvals. Like `crates/desktop`, it owns its own workspace
# so its dependency graph and lock file stay out of the core workspace's build.
[workspace]

[dependencies]
oxide-core = { path = "../core" }
oxide-desktop = { path = "../desktop" }
anyhow = "1"
# gpui's HTTP client unpacks tarballs through `zed-async-tar`, whose optional
# `xattr` 0.2.3 still names `libc::ENOATTR` on Linux. libc dropped that alias
# for Linux in 0.2.190, so the graph holds libc at the last release that
# defines it (as `ENODATA`). Drop this pin once `xattr` moves past 0.2.3.
libc = "=0.2.189"
# `runtime_shaders` compiles GPUI's Metal shaders at launch instead of at build
# time, so a machine without Xcode's downloadable Metal toolchain can still
# build this app (see docs/desktop-gpui.md).
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-util", "io-std", "sync", "net"] }
unicode-segmentation = "1"

# The window's glyphs are SVG, and the tests rasterise each one to prove it
# draws something: these are the same versions GPUI paints them with.
[dev-dependencies]
resvg = "0.45"
usvg = "0.45"

[[bin]]
name = "oxide-desktop-gpui"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
