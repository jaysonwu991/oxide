[package]
name = "oxide-desktop-tauri"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "Oxide for Desktop: the Tauri front-end"

# Tauri owns the window and the operating-system services; the shared desktop
# library owns projects, sessions, turns, approvals and updates. Like
# `crates/desktop`, this package is its own workspace so its dependency graph
# and lock file stay out of the core workspace's build.
[workspace]

[dependencies]
oxide-core = { path = "../core" }
oxide-desktop = { path = "../desktop" }
anyhow = "1"
keepawake = "0.6.1"
serde_json = "1"
tauri = "=2.12.7"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-notification = "=2.8.1"
tauri-plugin-opener = "=2.7.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }

[build-dependencies]
tauri-build = "=2.7.6"

[[bin]]
name = "oxide-desktop-tauri"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
